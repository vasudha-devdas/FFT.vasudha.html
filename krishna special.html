<html>
<head>
    <title>Krishna Special</title>

    <style>
        div {
            border-radius: 15px;
            border: 2px solid black;
            width: 500px;
            margin-left: 180px;
            margin-top: 50px;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        img {
            width: 250px;
            height: 250px;
            display: block;
            margin: auto;

            animation: vasudha 5s ease alternate infinite;
        }

        @keyframes vasudha {
            from {
                transform: scale(0);
            }

            to {
                transform: scale(1);
            }
        }

        img:hover {
            transform: scale(1.2);
        }
    </style>
</head>

<body>

    <div>
        <h1>Krishna Special</h1>

        <marquee direction="right">
            <img src="./krishna photo.jpeg" alt="Krishna">
        </marquee>
    </div>
    <br><br>
     

</body>
</html>

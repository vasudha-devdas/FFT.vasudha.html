<!DOCTYPE html>
<html>
<head>
    <title>Log in to Facebook</title>

    <style>
        .container {
            width: 300px;
            height: 500px;
            margin: 100px auto;
            padding: 100px;
            border: 1px solid rgb(9, 16, 19);
            border-radius: 50px;
            box-shadow: 4px 8px 22px rgba(33, 131, 244, 0.5);
        }

        h1 {
            color: rgb(27, 135, 251);
            margin-right: 10px;
        }

        input {
            width: 300px;
            height: 50px;
            margin-right: 10px;
            border-radius: 5px;
            border: 1px solid rgb(11, 16, 18);
        }

        .login {
            width: 300px;
            height: 40px;
            margin-right: 10px;
            border-radius: 30px;
            border: 1px solid rgb(11, 16, 18);
            background-color: rgb(33, 99, 243);
            color: white;
        }

        .login:hover {
            background-color: rgb(110, 169, 252);
        }

        .forgot {
            color: rgb(34, 150, 200);
            margin-right: 10px;
        }

        .create {
            width: 300px;
            height: 40px;
            margin-right: 10px;
            border-radius: 30px;
            border: 1px solid rgb(11, 16, 18);
            background-color: rgb(247, 250, 251);
            color: rgb(10, 7, 7);
        }

        .create:hover {
            background-color: rgb(111, 119, 122);
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Log in to Facebook</h1>

        <input type="text"
               placeholder="Email address or mobile number required">
        <br><br>

        <input type="password"
               placeholder="Password">
        <br><br>

        <button class="login">
            Log in
        </button>

        <p class="forgot">
            Forgot password?
        </p>

        <button class="create">
            Create New Account
        </button>

    </div>

</body>
</html>
